<!DOCTYPE html>
<html>
<head>
	<title id="text">Costco Party</title>
	<style>
		body {
			display: flex;
			flex-direction: column;
			align-items: center;
			text-align: center;
		}
	</style>
</head>
<body>
	<h1 id="text">Costco Party</h1>
	<h2 id="textTwo"> 1039 Augusta St, West Columbia, SC, 29169<br>9:00PM 9/10/2026</h2>
	<img id="picture" src="./IMG_1.png" style="max-width: 100%; height: auto;">
	<br>
	<input type="text" id="code" maxlength="3" inputmode="numeric" placeholder="Enter secret code">
	<button onclick="changeImage()" width="85%">Submit</button>
	



	<script>
        function changeImage() {

            let code = document.getElementById("code").value;
            let picture = document.getElementById("picture");
			let text = document.getElementById("text");
			let textTwo = document.getElementById("textTwo");

            if (code === "227") {
                picture.src = "./IMG_2.png";
				text.textContent = "Kirkiversary";
				textTwo.textContent = "1039 Augusta St, West Columbia, SC, 29169<br>9:00PM 9/10/1 (AK)";
            }
            else {
                alert("Incorrect code!");
            }
        }
    </script>
	

</body>
</html>

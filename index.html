<!DOCTYPE html>
<html>
<head>
	<title>Kirkluck</title>
	<style>
		body {
			display: flex;
			flex-direction: column;
			align-items: center;
			text-align: center;
		}
	</style>
</head>
<body>
	<h1>Kirkluck</h1>
	<h2> 1039 Augusta St, West Columbia, SC, 29169<br>9:30PM 9/10/26</h2>
	<img id="picture" src="IMG_1.PNG" width="500">
	<br>
	<input type="text" id="code" maxlength="3" inputmode="numeric" placeholder="Enter secret code">
	<button onclick="changeImage()">Submit</button>
	



	<script>
        function changeImage() {

            let code = document.getElementById("code").value;
            let picture = document.getElementById("picture");

            if (code === "227") {
                picture.src = "IMG_2.PNG";
            }
            else {
                alert("Incorrect code!");
            }
        }
    </script>
	

</body>
</html>
